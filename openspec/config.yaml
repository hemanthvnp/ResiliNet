schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Project: Network Rerouter, a steady-state fluid simulator of a campus network with a
  centralized routing controller. PLAN.md is the source of truth; cite its section numbers.
  Stack: Python 3.11+, pydantic v2, networkx, FastAPI, pytest + hypothesis, scipy (optional LP only);
  React + Vite + TypeScript, Cytoscape.js, Recharts. REST only. No database, containers, ML or WebSocket.
  Layout: core/{model,gen,routing,sim,metrics,explain} is pure Python with no web imports;
  api/ (FastAPI), cli/, frontend/, fixtures/, tests/.
  Policies: S0 (latency Dijkstra), S0-QoS (same routes, strict per-arc class priority),
  S1 and S2 (one residual-capacity allocator, two configs). S0-QoS is the baseline every headline is quoted against.
  Determinism: all randomness through an explicit random.Random(seed); sort by id wherever order could matter;
  Dijkstra tie-break (cost, hops, node ids); integer costs; never depend on dict or set ordering.
  Contract: core/model/types.py, fixtures/ and the OpenAPI schema are frozen at H1.5 and edited by humans only,
  after all four members agree, fixtures first.
  Ownership: A routing/ and explain/; B model/, gen/, sim/, metrics/; C frontend/; D api/, tests/, cli/, and for cycle 2 ext/ and examples/.
  Expected test numbers are worked by hand, never generated by the agent that writes the implementation.
  Cycle 2: PLAN-CYCLE2.md extends the frozen PLAN.md for H16 to H20 (changes submission-readiness,
  criticality-sweep, ecmp-baseline); cite it as "PLAN-CYCLE2 section N". Cycle-2 code lives only in ext/
  (imports core/ and cli/, imported by neither, no FastAPI or frontend imports) and data in examples/, both
  owned by D under the team's freeze exception; every other folder stays frozen. Additive only:
  new capabilities, no edits to cycle-1 modules or the contract. Extra policies ECMP and ECMP-QoS
  (idealised integer split per next hop, delivery as S0 and S0-QoS) are registered from ext/.
  Cycle-2 tests are written from the spec by a different model family, after a human re-checks the numbers.

# Per-artifact rules
rules:
  proposal:
    - Name the owner (A, B, C or D) and the folders the change touches; one change stays inside one owner's folders
    - Cite the PLAN.md sections the change implements, or the PLAN-CYCLE2.md sections for a cycle-2 change
    - Include a "Non-goals" section
    - State whether the frozen contract is touched; if it is, say that all four members must agree and fixtures change first
  design:
    - Record each decision with the alternative that was rejected and why
    - State how determinism is kept (seeded RNG, sorted iteration, tie-breaks) wherever order or randomness is involved
  specs:
    - Give every requirement at least one scenario with concrete inputs and expected values
    - Mark expected numbers as hand-worked and cite the PLAN.md or PLAN-CYCLE2.md section or fixture they come from; never derive them from the implementation
  tasks:
    - Start with a task that creates the branch feat/<change-name> from an up-to-date main
    - Make each task one commit-sized step that leaves the test suite passing
    - Put the test task next to the code it covers, not in a final testing group
    - End with tasks to run the full test suite and check_invariants, rebase onto main, run .github/scripts/check-history.sh and open the pull request
